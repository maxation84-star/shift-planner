# 잘못 승인된 요청 되돌리기 (일회성): 전희원 휴무 10/9 → 11/6 복구
name: Fix shared database
on:
  push:
    branches: [main]
    paths: ['db-fix.trigger']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          DB=$(python3 -c 'import json;print(json.load(open("share.json")).get("db",""))')
          echo "== restore 11/6 전희원(p5)"; curl -sS -m 30 -X PATCH "$DB/days/2026-11-06/off.json" -H 'Content-Type: application/json' -d '{"p5":"off"}'; echo
          echo "== remove 10/9"; curl -sS -m 30 -X DELETE "$DB/days/2026-10-09.json"; echo
          echo "== mark request reverted"
          python3 - "$DB" <<'PY'
          import json,sys,urllib.request
          db=sys.argv[1]
          reqs=json.load(urllib.request.urlopen(db+'/requests.json')) or []
          for q in reqs:
            if q.get('id')=='kmtr1sl': q['status']='reverted'
          r=urllib.request.Request(db+'/requests.json',data=json.dumps(reqs).encode(),method='PUT',headers={'Content-Type':'application/json'})
          print(urllib.request.urlopen(r).status)
          PY
          echo "== verify"; curl -sS -m 30 "$DB/days/2026-11-06.json"; echo; curl -sS -m 30 "$DB/days/2026-10-09.json"; echo
