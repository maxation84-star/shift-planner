# 계정 없는 공유 저장소(JSON bin)를 만들어 share.json 에 주소를 기록한다. (한 번만 실행)
name: Setup shared storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['share-setup.trigger']
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create bin and record share.json
        run: |
          set -e
          if [ -s share.json ] && grep -q '"bin"' share.json; then echo "share.json already set:"; cat share.json; exit 0; fi
          URL=""; KIND=""
          try_read () { echo "== read back $1"; curl -sS -m 30 "$1" -H 'Origin: https://maxation84-star.github.io' -D /tmp/h -o /tmp/b || true; grep -i '^HTTP\|access-control' /tmp/h || true; head -c 200 /tmp/b; echo; grep -q '"people"' /tmp/b; }
          echo "== try jsonblob"
          curl -sS -m 30 -D /tmp/h -o /tmp/b -X POST https://jsonblob.com/api/jsonBlob -H 'Content-Type: application/json' -H 'Accept: application/json' --data-binary @seed.json || true
          cat /tmp/h | tr -d '\r' | head -20; head -c 200 /tmp/b; echo
          LOC=$(grep -i '^location:' /tmp/h | tr -d '\r' | awk '{print $2}' || true)
          case "$LOC" in /*) URL="https://jsonblob.com$LOC";; http*) URL="$LOC";; esac
          if [ -n "$URL" ] && try_read "$URL"; then KIND=jsonblob; else URL=""; fi
          if [ -z "$URL" ]; then
            echo "== try kvdb.io"
            B=$(curl -sS -m 30 -d 'email=shift-planner-bot@example.com' https://kvdb.io || true); echo "bucket: $B"
            if echo "$B" | grep -Eq '^[A-Za-z0-9]{10,}$'; then
              U="https://kvdb.io/$B/schedule"
              curl -sS -m 30 -X PUT "$U" -H 'Content-Type: application/json' --data-binary @seed.json -D /tmp/h -o /tmp/b || true; tr -d '\r' < /tmp/h | head -5
              if try_read "$U"; then URL="$U"; KIND=kvdb; fi
            fi
          fi
          if [ -z "$URL" ]; then
            echo "== try npoint"
            curl -sS -m 30 -D /tmp/h -o /tmp/b -X POST https://api.npoint.io/ -H 'Content-Type: application/json' --data-binary "{\"contents\":$(cat seed.json)}" || true
            tr -d '\r' < /tmp/h | head -5; head -c 300 /tmp/b; echo
          fi
          if [ -z "$URL" ]; then
            echo "== try extendsclass"
            curl -sS -m 30 -D /tmp/h -o /tmp/b -X POST https://json.extendsclass.com/bin -H 'Content-Type: application/json' --data-binary @seed.json || true
            tr -d '\r' < /tmp/h | head -5; head -c 300 /tmp/b; echo
            ID=$(python3 -c 'import sys,json;d=json.load(open("/tmp/b"));print(d.get("id",""))' 2>/dev/null || true)
            if [ -n "$ID" ] && try_read "https://json.extendsclass.com/bin/$ID"; then URL="https://json.extendsclass.com/bin/$ID"; KIND=extendsclass; fi
          fi
          [ -n "$URL" ] || { echo "no provider worked"; exit 1; }
          echo "== bin: $URL ($KIND)"
          echo "== CORS preflight (PUT from github.io)"
          curl -sS -m 30 -i -X OPTIONS "$URL" -H 'Origin: https://maxation84-star.github.io' -H 'Access-Control-Request-Method: PUT' -H 'Access-Control-Request-Headers: content-type' | grep -i 'access-control\|^HTTP' || true
          printf '{"bin":"%s","kind":"%s"}\n' "$URL" "$KIND" > share.json
          git config user.name github-actions
          git config user.email actions@github.com
          git add share.json
          git commit -m "공유 저장소 연결 (share.json)"
          git push
