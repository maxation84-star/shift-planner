<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="근무표">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<!--ARTIFACT-START-->
<title>근무표 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 레이아웃: 상단 월 이동 바 + (달력 | 우측 집계 패널). 좁은 화면은 집계가 달력 위에 가로 스크롤 카드로. */
:root{
  --bg:#eef1f5; --paper:#ffffff; --paper-2:#f6f8fb; --ink:#172033; --muted:#5f6b7f;
  --line:#d5dce6; --line-soft:#e8edf3;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e3eef7;
  --sun:#c8322b; --sat:#2b5fb8; --today:#fff4d6;
  --tag-stay:#6b4fbb; --tag-work:#d9731a; --tag-empty:#6f7c92;
  --ok:#2a8f5a; --warn:#c77d05; --bad:#c8322b;
  --bk-multi:#f9c3c3; --bk-single:#ffffff; --bk-line:#c9d1dc;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-display:'Gowun Batang','Apple SD Gothic Neo','Malgun Gothic',serif;
  --shadow:0 10px 30px rgba(23,32,51,.14);
  --radius:12px;
}
/* 기본은 항상 화이트. 어두운 모드는 명시적으로 고른 경우(data-theme=dark)에만. */
:root{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0f141c; --paper:#171e29; --paper-2:#1d2533; --ink:#e6eaf1; --muted:#98a3b5;
  --line:#2b3645; --line-soft:#222c3a; --accent:#63a9dc; --accent-ink:#0f141c; --accent-soft:#1d3347;
  --sun:#ff8078; --sat:#88b0f2; --today:#3a3320; --tag-stay:#a48cf0; --tag-work:#f0a35a; --tag-empty:#9aa7ba;
  --ok:#4fc585; --warn:#f0b43a; --bad:#ff8078; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  --bk-multi:#f0a8a8; --bk-single:#e6eaf1; --bk-line:#5a6676;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}

/* 상단 바 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:var(--font-display);font-size:20px;margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.month-nav{display:flex;align-items:center;gap:4px;margin-inline:auto}
.month-nav h2{font-family:var(--font-display);font-size:22px;margin:0 8px;min-width:8.5em;text-align:center;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 12px;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.icon{padding:7px 10px;font-size:16px;line-height:1}
.btn.small{padding:4px 9px;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.sync{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--ok)} .sync.ro i{background:var(--warn)}

/* 빠른 입력 바 */
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.quick .label{font-weight:600;color:var(--ink)}
.pchip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px 4px 7px;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.pchip .dot{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.pchip.on{border-color:var(--pc);background:var(--pc);color:#1f2430}
.pchip.on .dot{background:#1f2430;opacity:.7}
.quick .hint{margin-left:auto}

/* 본문 그리드 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}
.sum{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.sum th{font-weight:600;color:var(--muted);text-align:right;padding:2px 4px;font-size:11px}
.sum th:first-child,.sum td:first-child{text-align:left}
.sum td{padding:4px 4px;border-top:1px solid var(--line-soft);text-align:right;white-space:nowrap}
.sum td i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.sum td small{color:var(--muted);margin-left:4px;font-size:10px}
.sum td.ok{color:var(--ok)} .sum td.bad{color:var(--bad);font-weight:700}

/* 달력 */
.cal-wrap{min-width:0}
.cal-head{display:grid;grid-template-columns:var(--labw) repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:0 0 6px}
:root{--labw:38px;--laneh:14px}
.cal-head .d0{color:var(--sun)} .cal-head .d6{color:var(--sat)}
.cal{display:grid;grid-template-columns:var(--labw) repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.rlab{background:var(--paper-2);display:flex;flex-direction:column;gap:2px;padding:27px 0 0 3px;font-size:9px;color:var(--muted);font-weight:600}
.rlab div{height:var(--laneh);line-height:var(--laneh);overflow:hidden;white-space:nowrap}
.rlab .short{display:none}
.lanes{display:flex;flex-direction:column;gap:2px;margin:0 -5px 2px;min-width:0}
.lane{display:block;height:var(--laneh);position:relative}
.lb{display:block;position:absolute;top:0;bottom:0;left:0;right:0;font-size:9px;line-height:var(--laneh);padding-left:5px;color:#1f2430;font-weight:700;white-space:nowrap;overflow:hidden;background:var(--rc)}
.lb.in{left:3px;border-radius:7px 0 0 7px}
.lb.end{right:3px;border-radius:0 7px 7px 0}
.lb.in.end{border-radius:7px}
.lb.vac{background:none;color:var(--muted);font-weight:500;opacity:.75;box-shadow:none}
.lb.multi{background:var(--bk-multi)}
.lb.single{background:var(--bk-single);box-shadow:inset 0 0 0 1.5px var(--bk-line)}
.lb.work{left:3px;right:3px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--tag-work) 0 4px,rgba(217,115,26,.35) 4px 8px);color:#1f2430}
.lb.work.in{left:3px;border-radius:7px 0 0 7px}
.lb.work.end{right:3px;border-radius:0 7px 7px 0}
.lb.work.in.end{border-radius:7px}
.lane{border-bottom:1px dotted var(--line-soft)}
.cell{background:var(--paper);min-height:98px;padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;position:relative;min-width:0;transition:background .12s}
.cell:hover{background:var(--paper-2)}
.cell.out{background:var(--paper-2);color:var(--muted);opacity:.55}
.cell.today{background:var(--today)}
.cell .num{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.cell.today .num::after{content:"오늘";font-size:9px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:999px}
.cell.d0 .num{color:var(--sun)} .cell.d6 .num{color:var(--sat)}
.tags{display:flex;flex-wrap:wrap;gap:2px}
.tag{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;color:#fff;line-height:1.4}
.tag.stay{background:var(--tag-stay)} .tag.work{background:var(--tag-work)} .tag.empty{background:var(--tag-empty)}
.tag .short{display:none}
.offs{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:auto}
.chip{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;color:#1f2430;background:var(--pc);line-height:1.35;display:flex;align-items:center;gap:4px;min-width:0}
.chip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[data-pid],.pchip{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.chip.dragging{opacity:.35}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-120%);box-shadow:var(--shadow);font-size:13px;padding:5px 10px}
.cell.drop{outline:3px solid var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.cell.drop-del{outline:3px dashed var(--bad);outline-offset:-3px}
.chip .k{margin-left:auto;font-size:9px;background:rgba(0,0,0,.12);padding:0 4px;border-radius:3px;flex:none}
.chip.annual{background:transparent;color:var(--ink);border:2px solid var(--pc)}
.chip.annual .k{background:var(--pc);color:#1f2430}
.chip.extra{background:transparent;color:var(--ink);border:2px dashed var(--pc)}
.chip.extra .k{background:var(--pc);color:#1f2430}
.memo{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal.quick .cell{cursor:copy}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11px;color:var(--muted);margin-top:8px;align-items:center}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.legend .sw.sol{background:var(--muted)} .legend .sw.ann{border:1.5px solid var(--muted)} .legend .sw.ext{border:1.5px dashed var(--muted)}
.legend .sw.stay{background:#9ed5f5;border-radius:6px 0 0 6px;width:18px} .legend .sw.work{background:repeating-linear-gradient(-45deg,var(--tag-work) 0 3px,rgba(217,115,26,.35) 3px 6px)} .legend .sw.empty{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border:1px solid var(--line)}

/* 집계 패널 */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.total{display:flex;align-items:baseline;gap:8px}
.total b{font-size:26px;font-variant-numeric:tabular-nums}
.total span{color:var(--muted);font-size:12px}
.pcard{border-left:4px solid var(--pc);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.pcard .name{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.pcard .name .edit{margin-left:auto;background:none;border:0;color:var(--muted);font-size:13px;padding:2px 4px}
.bar{height:7px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc);border-radius:999px;transition:width .25s}
.bar.over i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.stat{background:var(--paper-2);border-radius:8px;padding:6px 8px}
.stat .l{font-size:10px;color:var(--muted);font-weight:600}
.stat .v{font-size:16px;font-weight:700;line-height:1.2}
.stat .v small{font-size:11px;color:var(--muted);font-weight:500}
.stat .r{font-size:11px;color:var(--muted)}
.stat .r.ok{color:var(--ok)} .stat .r.warn{color:var(--warn)} .stat .r.bad{color:var(--bad)}
.dates{font-size:12px;color:var(--muted);line-height:1.6}
.dates b{color:var(--ink);font-weight:600}
.daytags{display:flex;flex-direction:column;gap:4px;font-size:12px}
.daytags .row{display:flex;gap:8px;align-items:baseline}
.daytags .row .tag{flex:none}
.empty-note{font-size:12px;color:var(--muted);padding:8px 2px}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{background:var(--paper);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
@media(min-width:640px){.overlay{align-items:center;padding:16px}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-size:18px;font-family:var(--font-display)}
.sheet .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.sheet .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.sheet .row .who{display:flex;align-items:center;gap:6px;font-weight:600;min-width:6em}
.sheet .row .who .dot{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--paper);padding:6px 11px;font-size:13px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.c{background:var(--pc);color:#1f2430}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.tbtn.on.stay{background:var(--tag-stay);border-color:var(--tag-stay);color:#fff}
.tbtn.on.work{background:var(--tag-work);border-color:var(--tag-work);color:#fff}
.tbtn.on.empty{background:var(--tag-empty);border-color:var(--tag-empty);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);min-width:0;width:100%}
.field textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.check{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.check input{width:16px;height:16px}
.plist{display:flex;flex-direction:column;gap:10px}
.pedit{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.pedit .nm{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.pedit .nm input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper);min-width:0}
.pedit .opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;grid-column:1/-1;font-size:13px}
.pedit .opts label{display:flex;align-items:center;gap:5px;color:var(--muted)}
.pedit .opts input[type=number]{width:4.5em;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--paper)}
.sw-row{display:flex;gap:5px;flex-wrap:wrap}
.swb{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.swb{border:2px solid rgba(0,0,0,.12)}
.swb.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.msg{font-size:12px;color:var(--muted);margin-top:6px}
.msg.bad{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:10px}

/* 좁은 화면 */
@media(max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:-1;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;scroll-snap-type:x proximity}
  .side .panel{flex:0 0 min(78vw,300px);scroll-snap-align:start}
  .side .panel.total-panel{flex-basis:150px}
  .side{max-height:none;overflow-x:auto}
  .month-nav h2{font-size:19px;min-width:7.5em}
}
@media(max-width:560px){
  :root{--labw:16px;--laneh:12px}
  .rlab{padding:22px 0 0 1px;font-size:8px}
  .rlab .long{display:none} .rlab .short{display:block}
  .lb{font-size:8px;padding-left:3px;letter-spacing:-.02em}
  .offs{grid-template-columns:1fr}
  .cell{min-height:74px;padding:3px 3px 4px}
  .cell .num{font-size:12px}
  .cell.today .num::after{content:"";width:5px;height:5px;padding:0;border-radius:50%}
  .chip{font-size:10px;padding:1px 4px;border-radius:4px}
  .chip .k{display:none}
  .chip.annual{border-width:1.5px}
  .tag{font-size:9px;padding:0 4px}
  .tag .long{display:none} .tag .short{display:inline}
  .memo{display:none}
  .brand small{display:none}
  .quick .hint{display:none}
  .month-nav{order:3;width:100%;justify-content:center}
}
/* 주간 보기 (폰 기본) */
.wk{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wday{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 10px;padding:10px 10px 10px 8px;border-top:1px solid var(--line-soft);text-align:left;background:var(--paper);border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit}
.wday:first-child{border-top:0}
.wday.today{background:var(--today)}
.wday .wdate{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px}
.wday .wdate b{font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.wday .wdate span{font-size:12px;color:var(--muted);margin-top:3px}
.wday.d0 .wdate b,.wday.d0 .wdate span{color:var(--sun)} .wday.d6 .wdate b,.wday.d6 .wdate span{color:var(--sat)}
.wday.today .wdate::after{content:"오늘";font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:999px;margin-top:4px}
.wbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.wrooms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.wr{font-size:12px;font-weight:600;padding:4px 6px;border-radius:7px;text-align:center;color:#1f2430;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:4px solid var(--rc)}
.wr.vac{background:var(--paper-2);color:var(--muted);font-weight:500}
.wr.single{background:var(--bk-single);box-shadow:inset 0 0 0 1.5px var(--bk-line)}
.wr.multi{background:var(--bk-multi)}
.wr.work{background:repeating-linear-gradient(-45deg,var(--tag-work) 0 4px,rgba(217,115,26,.35) 4px 8px)}
.woffs{display:flex;flex-wrap:wrap;gap:5px}
.woffs .chip{font-size:13px;padding:4px 10px;border-radius:7px}
.woffs .none{font-size:12px;color:var(--muted);padding:3px 0}
.wk .memo{font-size:12px;white-space:normal}
.wrange{font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 8px}
@media(max-width:400px){.wrooms{grid-template-columns:repeat(2,minmax(0,1fr))}.wday{grid-template-columns:48px minmax(0,1fr);padding:9px 8px 9px 6px}}

<script>
(function(){
'use strict';
const STORE_KEY='shiftplan.v1';
const PALETTE=['#f9b5cc','#c8b6f2','#a9e5cf','#ffcaa6','#a9d9f4','#f7e3a1','#f4a9b8','#e2b9ea','#c7e8a7','#b8c6f7','#ffd6e0','#d4f1f4'];
const OLD_PALETTE=['#2563eb','#db2777','#16a34a','#d97706','#7c3aed','#0891b2','#dc2626','#4b5563'];
const CHIP_INK='#1f2430';
const TYPES={off:'휴무',annual:'연차',extra:'추가'};
const TAGS={stay:'연박',work:'공사',empty:'공실'};
const ROOM_PALETTE=['#f6c1d9','#9ed5f5','#ffd59a','#b5e3b0','#d9c6f5','#ffc4b0','#a8e8e0','#f0e2a0'];
const DEFAULT_ROOMS=['다락','첨벙','모닥','노지'];
const DOW=['일','월','화','수','목','금','토'];
const $=s=>document.querySelector(s);

/* ---------- 상태 ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const WORK={w6:{label:'주6일',off:4},w5:{label:'주5일',off:8}};
const DEFAULT_PEOPLE=[['허나경','w6'],['홍기범','w6'],['김경숙','w5'],['김규선','w6'],['전희원','w6'],['서수정','w6'],['김정민','w6'],['박태선','w6'],['용태중','w5'],['김은정','w6']];
function defaultState(){
  return {version:1,people:DEFAULT_PEOPLE.map(([name,w],i)=>({id:'p'+(i+1),name,color:PALETTE[i%PALETTE.length],work:w,baseOff:WORK[w].off,annual:1})),
    rooms:DEFAULT_ROOMS.map((name,i)=>({id:'r'+(i+1),name,color:ROOM_PALETTE[i]})),bookings:[],requests:[],days:{}};
}
function normalize(s){
  if(!s||typeof s!=='object')return defaultState();
  const out={version:1,people:[],rooms:[],bookings:[],requests:[],days:{}};
  (Array.isArray(s.people)?s.people:[]).forEach((p,i)=>{
    if(!p)return;
    const work=WORK[p.work]?p.work:(p.baseOff==8?'w5':'w6');
    let color=/^#[0-9a-f]{6}$/i.test(p.color)?p.color.toLowerCase():PALETTE[i%PALETTE.length];
    const oi=OLD_PALETTE.indexOf(color);if(oi>=0)color=PALETTE[i%PALETTE.length];
    out.people.push({id:String(p.id||uid()),name:String(p.name||'이름'),color,
      work,baseOff:clampInt(p.baseOff,0,31,WORK[work].off),annual:clampInt(p.annual,0,31,1)});
  });
  if(!out.people.length)out.people=defaultState().people;
  (Array.isArray(s.rooms)?s.rooms:[]).forEach((r,i)=>{if(!r)return;out.rooms.push({id:String(r.id||uid()),name:String(r.name||'객실').slice(0,8),color:/^#[0-9a-f]{6}$/i.test(r.color)?r.color.toLowerCase():ROOM_PALETTE[i%ROOM_PALETTE.length]});});
  if(!out.rooms.length)out.rooms=defaultState().rooms;
  const rids=new Set(out.rooms.map(r=>r.id));
  const cutoff=Date.now()-60*86400000;
  const pids=new Set(out.people.map(p=>p.id));
  (Array.isArray(s.requests)?s.requests:[]).forEach(q=>{
    if(!q||!pids.has(q.pid))return;const ok=d=>!d||/^\d{4}-\d{2}-\d{2}$/.test(d);if(!ok(q.from)||!ok(q.to)||(!q.from&&!q.to))return;
    const st=['pending','approved','rejected','reverted'].includes(q.status)?q.status:'pending';const t=+q.t||Date.now();
    if(st!=='pending'&&t<cutoff)return;
    out.requests.push({id:String(q.id||uid()),pid:q.pid,from:q.from||'',to:q.to||'',note:String(q.note||'').slice(0,80),status:st,t});
  });
  out.requests=out.requests.slice(-200);
  (Array.isArray(s.bookings)?s.bookings:[]).forEach(b=>{
    if(!b||!rids.has(b.room)||!/^\d{4}-\d{2}-\d{2}$/.test(b.start||''))return;
    out.bookings.push({id:String(b.id||uid()),room:b.room,start:b.start,nights:clampInt(b.nights,1,90,1),kind:b.kind==='work'?'work':'stay',label:''});
  });
  const ids=new Set(out.people.map(p=>p.id));
  Object.keys(s.days||{}).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
    const d=s.days[k]||{};const nd={off:{},tags:[],memo:''};
    Object.keys(d.off||{}).forEach(pid=>{if(ids.has(pid)&&TYPES[d.off[pid]])nd.off[pid]=d.off[pid];});
    (Array.isArray(d.tags)?d.tags:[]).forEach(t=>{if(TAGS[t]&&!nd.tags.includes(t))nd.tags.push(t);});
    nd.memo=String(d.memo||'').slice(0,80);
    if(Object.keys(nd.off).length||nd.tags.length||nd.memo)out.days[k]=nd;
  });
  return out;
}
function clampInt(v,lo,hi,def){v=parseInt(v,10);if(isNaN(v))return def;return Math.max(lo,Math.min(hi,v));}
function loadLocal(){try{const raw=localStorage.getItem(STORE_KEY);if(raw)return normalize(JSON.parse(raw));}catch(e){}return null;}
const HIST_KEY='shiftplan.hist',HIST_MAX=40;
function loadHist(){try{const a=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function pushHist(json){
  try{const h=loadHist();const now=Date.now();const last=h[h.length-1];
    if(last&&last.d===json)return;
    if(last&&now-last.t<120000)h[h.length-1]={t:now,d:json};else h.push({t:now,d:json});
    while(h.length>HIST_MAX)h.shift();
    localStorage.setItem(HIST_KEY,JSON.stringify(h));}catch(e){}
}
function persistLocal(){try{const j=JSON.stringify(state);localStorage.setItem(STORE_KEY,j);pushHist(j);}catch(e){}}

/* 11월 임시 휴무표(이름 기준). 해당 달에 입력이 없을 때 한 번만 채워 넣는다. */
const SEED={month:"2026-11",days:{"2026-11-01":{"off":{"김경숙":"off","김정민":"off","용태중":"off"}},"2026-11-02":{"off":{"김경숙":"off"}},"2026-11-03":{"off":{"김규선":"off","서수정":"off","박태선":"off"}},"2026-11-05":{"off":{"김정민":"off"}},"2026-11-06":{"off":{"허나경":"off","전희원":"off"}},"2026-11-07":{"off":{"용태중":"off","김은정":"off"}},"2026-11-08":{"off":{"김은정":"off"}},"2026-11-09":{"off":{"홍기범":"off","박태선":"off"}},"2026-11-10":{"off":{"홍기범":"off","김규선":"annual","서수정":"off","김정민":"annual"}},"2026-11-11":{"off":{"허나경":"off","김경숙":"off","김규선":"off","용태중":"off"}},"2026-11-12":{"off":{"허나경":"annual","김경숙":"annual","전희원":"annual","김은정":"annual"}},"2026-11-13":{"off":{"전희원":"off"}},"2026-11-14":{"off":{"박태선":"off","용태중":"off"}},"2026-11-15":{"off":{"용태중":"off"}},"2026-11-17":{"off":{"김규선":"off"}},"2026-11-19":{"off":{"김경숙":"off","전희원":"off","용태중":"off"}},"2026-11-20":{"off":{"김경숙":"off","박태선":"annual"}},"2026-11-21":{"off":{"서수정":"annual","김정민":"off"}},"2026-11-22":{"off":{"김경숙":"off"}},"2026-11-23":{"off":{"용태중":"off"}},"2026-11-24":{"off":{"용태중":"annual"}},"2026-11-25":{"off":{"김경숙":"off","김규선":"off","서수정":"off","김정민":"off"}},"2026-11-26":{"off":{"박태선":"off"}},"2026-11-27":{"off":{"전희원":"off"}},"2026-11-29":{"off":{"용태중":"off"}},"2026-11-30":{"off":{"김경숙":"off","서수정":"off"}}}};
SEED.bookings=[
  {room:'다락',start:'2026-10-31',nights:1,label:''},{room:'다락',start:'2026-11-01',nights:1,label:''},{room:'다락',start:'2026-11-02',nights:2,label:''},
  {room:'첨벙',start:'2026-10-30',nights:2,label:''},{room:'첨벙',start:'2026-11-01',nights:1,label:''},{room:'첨벙',start:'2026-11-02',nights:1,label:''},
  {room:'모닥',start:'2026-10-31',nights:2,label:''},{room:'모닥',start:'2026-11-02',nights:2,label:''},
  {room:'노지',start:'2026-10-31',nights:1,label:''},{room:'노지',start:'2026-11-01',nights:1,label:''},{room:'노지',start:'2026-11-03',nights:1,label:''}];
function applyViewMode(){
  document.body.classList.toggle('view-mode',viewOnly);
  $('#legendHint').textContent=viewOnly?'날짜를 누르면 그 날 휴무·객실 상태가 보입니다':'날짜를 누르면 입실·휴무 입력 · 이름 칩을 끌어 다른 날짜에 놓으면 옮겨지고, 달력 밖에 놓으면 빠집니다';
  $('#viewBanner').hidden=!viewOnly;
  ['peopleBtn','autoBtn','backupBtn'].forEach(id=>$('#'+id).hidden=viewOnly);
  $('#quick').hidden=viewOnly;
  renderReqBtn();render();
}
function applySeed(){
  try{
    const bflag='shiftplan.seed.bookings.'+SEED.month;
    if(!localStorage.getItem(bflag)&&!state.bookings.length){
      const byRoom=Object.fromEntries(state.rooms.map(r=>[r.name,r.id]));
      SEED.bookings.forEach(b=>{if(byRoom[b.room])state.bookings.push({id:uid(),room:byRoom[b.room],start:b.start,nights:b.nights,kind:'stay',label:b.label});});
      localStorage.setItem(bflag,'1');persistLocal();
    }
    const flag='shiftplan.seed.'+SEED.month;if(localStorage.getItem(flag))return;
    if(Object.keys(state.days).some(k=>k.startsWith(SEED.month)))return;
    const byName=Object.fromEntries(state.people.map(p=>[p.name,p.id]));
    Object.keys(SEED.days).forEach(k=>{const d=JSON.parse(JSON.stringify(getDay(k)));Object.entries(SEED.days[k].off).forEach(([n,t])=>{if(byName[n])d.off[byName[n]]=t;});setDay(k,d);});
    localStorage.setItem(flag,'1');persistLocal();
  }catch(e){}
}
let state=loadLocal()||defaultState();
if(!Object.keys(state.days).length&&state.people.length===2&&state.people.map(p=>p.name).join()==='홍기범,헌화경'){state=defaultState();persistLocal();}
const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
function pickStartMonth(){
  const cur=key(view.y,view.m,1).slice(0,7);const nx=new Date(view.y,view.m+1,1);const nxk=key(nx.getFullYear(),nx.getMonth(),1).slice(0,7);
  const has=pre=>Object.keys(state.days).some(k=>k.startsWith(pre));
  if(!has(cur)&&has(nxk)){view={y:nx.getFullYear(),m:nx.getMonth()};weekStart=sundayOf(key(view.y,view.m,1));}
}
let quickPerson=null;
const MODE_KEY='shiftplan.mode';
let mode='month';try{mode=localStorage.getItem(MODE_KEY)||(window.innerWidth<=700?'week':'month');}catch(e){mode=window.innerWidth<=700?'week':'month';}
function sundayOf(k){const [y,m,d]=k.split('-').map(Number);const wd=dow(y,m-1,d);return addDays(k,-wd);}
let weekStart=null;

/* ---------- 공유 저장 ----------
   1) claude.ai 아티팩트로 열리면 db 기능 사용
   2) 공개 웹(GitHub Pages 등)에서는 Firebase Realtime Database 주소(#db=…)로 공유
   3) 둘 다 없으면 이 기기(localStorage)에만 저장 */
let db=null,cloudRef=null,saveTimer=null,readOnly=false,pushedOnce=false;
let fbUrl=null,fbES=null,viewOnly=false,fbAuto=false;
const DB_KEY='shiftplan.db';
let bin=null;const BIN_KEY='shiftplan.bin';let editor=false;
function readShareHash(){
  const h=location.hash||'';
  try{if(/[#&]edit\b/.test(h))localStorage.setItem('shiftplan.editor','1');if(/[#&]view\b/.test(h))localStorage.removeItem('shiftplan.editor');editor=localStorage.getItem('shiftplan.editor')==='1';}catch(e){}const m=h.match(/[#&]db=([^&]+)/);const b=h.match(/[#&]bin=([^&]+)/);const kk=h.match(/[#&]key=([^&]+)/);
  if(b){try{bin={url:decodeURIComponent(b[1]),key:kk?decodeURIComponent(kk[1]):''};if(!/^https:\/\/(json\.extendsclass\.com\/bin\/|jsonblob\.com\/api\/jsonBlob\/)[A-Za-z0-9-]+$/.test(bin.url))bin=null;else localStorage.setItem(BIN_KEY,JSON.stringify(bin));}catch(e){bin=null;}}
  else{try{bin=JSON.parse(localStorage.getItem(BIN_KEY)||'null');}catch(e){bin=null;}}
  if(m){try{fbUrl=cleanDbUrl(decodeURIComponent(m[1]));localStorage.setItem(DB_KEY,fbUrl);}catch(e){}}
  else{try{fbUrl=localStorage.getItem(DB_KEY)||null;}catch(e){}}
  viewOnly=/[#&]ro=1/.test(h);
  if(viewOnly){readOnly=true;$('#viewBanner').hidden=false;}
}
function cleanDbUrl(u){
  u=String(u||'').trim().replace(/\.json(\?.*)?$/,'').replace(/\/+$/,'');
  if(!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)(\/[A-Za-z0-9_\-./~]*)?$/.test(u))throw new Error('bad url');
  return u;
}
function initFirebase(){
  if(!fbUrl||!('EventSource' in window))return;
  const apply=data=>{
    if(data&&data.people){const n=normalize(JSON.parse(JSON.stringify(data)));if(JSON.stringify(n)!==JSON.stringify(state)){state=n;persistLocal();render();}}
    else if(!pushedOnce&&!viewOnly){pushedOnce=true;cloudSave();}
    setSync('cloud',viewOnly?'공유본 보기 전용':'기기 + 공유 저장 중');
  };
  const refetch=()=>fetch(fbUrl+'.json').then(r=>r.ok?r.json():null).then(apply).catch(()=>{});
  try{fbES=new EventSource(fbUrl+'.json');}catch(e){setSync('local','주소 오류 · 이 기기에 저장');return;}
  fbES.addEventListener('put',e=>{try{const {path,data}=JSON.parse(e.data);if(path==='/')apply(data);else refetch();}catch(x){}});
  fbES.addEventListener('patch',refetch);
  fbES.addEventListener('cancel',()=>setSync('ro','공유 저장소 권한 없음'));
  fbES.onerror=()=>setSync('local','연결 끊김 · 다시 연결 중');
  setSync('cloud','공유 저장소 연결 중');
}
/* 계정 없는 공유 저장소: JSON bin (extendsclass / jsonblob). GET 폴링 + PUT */
let binTimer=null,binBusy=false;
function applyRemote(data,label){
  if(data&&data.people){const n=normalize(JSON.parse(JSON.stringify(data)));if(JSON.stringify(n)!==JSON.stringify(state)){state=n;persistLocal();render();}}
  setSync('cloud',label);
}
async function binFetch(){
  if(!bin||binBusy)return;binBusy=true;
  try{const r=await fetch(bin.url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const data=await r.json();
    applyRemote(data,viewOnly||!bin.key&&bin.url.includes('extendsclass')?'공유본 보기':'기기 + 공유 저장 중');}
  catch(e){console.warn('binFetch',e);setSync('local','공유 저장소 연결 안 됨');}
  binBusy=false;
}
function initBin(){
  if(!bin)return;
  binFetch();binTimer=setInterval(binFetch,15000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')binFetch();});
}
async function binSave(){
  try{const h={'Content-Type':'application/json'};if(bin.key)h['Security-key']=bin.key;
    const r=await fetch(bin.url,{method:'PUT',headers:h,body:JSON.stringify(state)});
    if(!r.ok)throw new Error(r.status);setSync('cloud','기기 + 공유 저장 중');}
  catch(e){setSync('ro','공유 저장 실패');toast('공유 저장소에 저장하지 못했습니다. 편집 링크로 열었는지 확인하세요.');}
}
async function remoteMutate(fn){

function setSync(mode,text){const el=$('#sync');el.className='sync '+mode;el.querySelector('span').textContent=text;}
async function initCloud(){
  if(!(window.claude&&typeof window.claude.use==='function')){
    readShareHash();$('#shareSetBtn').hidden=false;
    if(fbUrl){initFirebase();applyViewMode();return;}
    if(bin){initBin();applyViewMode();return;}
    /* 저장소에 심어 둔 공유 주소(share.json)가 있으면 자동 연결: 기본은 보기 모드, #edit 로 연 기기만 편집 */
    try{const r=await fetch('share.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();
      if(j&&j.db){try{fbUrl=cleanDbUrl(j.db);fbAuto=true;if(!editor)viewOnly=readOnly=true;initFirebase();}catch(e){}}
      else if(j&&j.bin){bin={url:String(j.bin),key:String(j.key||''),auto:true};if(!editor)viewOnly=readOnly=true;initBin();}}}catch(e){}
    applyViewMode();return;
  }
  try{db=await window.claude.use('db');}catch(e){db=null;}
  if(!db)return;
  try{cloudRef=db.doc('schedule/main');}catch(e){db=null;return;}
  cloudRef.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(snap.exists){
      const remote=snap.data();
      if(remote&&remote.people&&JSON.stringify(normalize(remote))!==JSON.stringify(state)){
        state=normalize(JSON.parse(JSON.stringify(remote)));persistLocal();render();
      }
      setSync('cloud',readOnly?'공유본 보기 (읽기 전용)':'기기 + 공유 저장 중');
    }else if(!(snap.metadata&&snap.metadata.fromCache)&&!pushedOnce){
      pushedOnce=true;cloudSave();
    }
  },err=>{db=null;setSync('local','이 기기에만 저장');});
}
function scheduleSave(){
  persistLocal();
  if(!(db||fbUrl||bin)||readOnly)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(cloudSave,500);
}
async function cloudSave(){
  if(readOnly)return;
  if(!cloudRef){if(fbUrl)fbSave();else if(bin)binSave();return;}
  try{await cloudRef.set(JSON.parse(JSON.stringify(state)));setSync('cloud','기기 + 공유 저장 중');}
  catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;$('#roBanner').hidden=false;setSync('ro','읽기 전용');}
    else if(e&&e.code==='unavailable'){setTimeout(cloudSave,800+Math.random()*700);}
    else{setSync('local','이 기기에만 저장');}
  }
}

/* ---------- 날짜 도우미 ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dow=(y,m,d)=>new Date(y,m,d).getDay();
const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());
function monthKeys(y,m){const n=dim(y,m),a=[];for(let d=1;d<=n;d++)a.push(key(y,m,d));return a;}
function getDay(k){return state.days[k]||{off:{},tags:[],memo:''};}
function setDay(k,d){
  if(Object.keys(d.off).length||d.tags.length||d.memo)state.days[k]=d;else delete state.days[k];
}
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);const t=new Date(y,m-1,d+n);return key(t.getFullYear(),t.getMonth(),t.getDate());}
function bookingEnd(b){return addDays(b.start,b.nights);}
/* 날짜 k에서 객실 r의 띠 상태 */
function laneState(rid,k){
  let cover=null,out=null;
  state.bookings.forEach(b=>{if(b.room!==rid)return;const e=bookingEnd(b);if(b.start<=k&&k<e)cover=b;else if(e===k)out=b;});
  return {cover,out};
}
function changeBookings(fn){if(viewOnly){toast('보기 전용 링크에서는 입력할 수 없습니다');return;}fn();scheduleSave();render();}
function changeDay(k,fn){if(viewOnly){toast('보기 전용 링크에서는 입력할 수 없습니다');return;}const d=JSON.parse(JSON.stringify(getDay(k)));fn(d);setDay(k,d);scheduleSave();render();}

/* ---------- 집계 ---------- */
function monthStats(y,m){
  const keys=monthKeys(y,m);
  return state.people.map(p=>{
    const r={p,off:[],annual:[],extra:[]};
    keys.forEach(k=>{const t=getDay(k).off[p.id];if(t)r[t].push(parseInt(k.slice(8),10));});
    r.total=r.off.length+r.annual.length+r.extra.length;
    r.offLeft=p.baseOff-r.off.length;
    r.annualLeft=p.annual-r.annual.length;
    return r;
  });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderCal(){
  const cal=$('#cal');cal.innerHTML='';
  const {y,m}=view;const first=dow(y,m,1);const n=dim(y,m);
  const prevN=dim(y,m-1<0?11:m-1);
  const cells=[];
  for(let i=first-1;i>=0;i--)cells.push({d:prevN-i,out:true});
  for(let d=1;d<=n;d++)cells.push({d,out:false});
  while(cells.length%7)cells.push({d:cells.length-first-n+1,out:true});
  const people=Object.fromEntries(state.people.map(p=>[p.id,p]));
  cells.forEach((c,i)=>{

    if(wd===0){const lab=document.createElement('div');lab.className='rlab';lab.innerHTML=state.rooms.map(r=>`<div title="${esc(r.name)}" style="border-left:3px solid ${r.color};padding-left:2px"><span class="long">${esc(r.name)}</span><span class="short">${esc(r.name.slice(0,1))}</span></div>`).join('');cal.appendChild(lab);}
    const el=document.createElement('button');
    el.className='cell d'+wd+(c.out?' out':'');
    if(c.out){el.innerHTML=`<span class="num">${c.d}</span>`;el.disabled=true;cal.appendChild(el);return;}
    const k=key(y,m,c.d);const day=getDay(k);

    html+='<span class="lanes">'+state.rooms.map(r=>{const {cover,out}=laneState(r.id,k);let b='';
      const kindCls=x=>x.kind==='work'?'work':(x.nights>=2?'multi':'single');
      if(cover){const isIn=cover.start===k;const isEnd=bookingEnd(cover)===addDays(k,1);const cls=kindCls(cover)+(isIn?' in':'')+(isEnd?' end':'');
        const txt=isIn?(cover.kind==='work'?`공사 ${cover.nights}일`:cover.nights>=2?`연박 ${cover.nights}박`:'입실'):'';
        b+=`<span class="lb ${cls}">${cover.kind==='work'&&!isIn?'':txt}</span>`;}
      else b+=`<span class="lb vac">공실</span>`;
      return `<span class="lane">${b}</span>`;}).join('')+'</span>';
    if(day.memo)html+=`<span class="memo">${esc(day.memo)}</span>`;
    const offs=state.people.filter(p=>day.off[p.id]);
    if(offs.length){html+='<span class="offs">'+offs.map(p=>{const t=day.off[p.id];return `<span class="chip ${t}" data-pid="${p.id}" data-t="${t}" style="--pc:${p.color}"><span class="n">${esc(p.name)}</span></span>`;}).join('')+'</span>';}
    el.innerHTML=html;

/* ---------- 끌어서 옮기기 (마우스·터치) ---------- */
let drag=null,suppressClick=false;
function startDrag(e,pid,type,from,el){
  if(viewOnly||e.button>0)return;
  drag={pid,type,from,el,x:e.clientX,y:e.clientY,moved:false,ghost:null,over:null};
  try{el.setPointerCapture(e.pointerId);}catch(x){}
}
function dragTarget(d,x,y){
  const g=d.ghost;if(g)g.hidden=true;
  const t=document.elementFromPoint(x,y);if(g)g.hidden=false;
  if(!t)return null;const cell=t.closest('.cell');
  return cell&&cell.dataset.k?cell:null;
}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;
    drag.moved=true;const p=state.people.find(x=>x.id===drag.pid);
    const g=document.createElement('span');g.className='chip ghost '+drag.type;g.style.setProperty('--pc',p?p.color:'#ccc');g.textContent=(p?p.name:'')+(drag.type==='off'?'':' '+TYPES[drag.type]);document.body.appendChild(g);drag.ghost=g;
    if(drag.from)drag.el.classList.add('dragging');}
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  const cell=dragTarget(drag,e.clientX,e.clientY);
  if(drag.over&&drag.over!==cell)drag.over.classList.remove('drop');
  if(cell&&cell.dataset.k!==drag.from)cell.classList.add('drop');
  drag.over=cell;
  e.preventDefault();
},{passive:false});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();if(d.over)d.over.classList.remove('drop');d.el.classList.remove('dragging');
  if(!d.moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,350);
  if(cancel)return;
  const cell=dragTarget(d,e.clientX,e.clientY);
  if(!cell){ if(d.from){changeDay(d.from,dd=>{delete dd.off[d.pid];});toast('휴무를 뺐습니다');} return; }
  const to=cell.dataset.k;if(to===d.from)return;
  if(d.from)changeDay(d.from,dd=>{delete dd.off[d.pid];});
  changeDay(to,dd=>{dd.off[d.pid]=d.type;});
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

function cycle(k,pid){
  const order=[undefined,'off','annual','extra'];
  changeDay(k,d=>{const cur=d.off[pid];const nx=order[(order.indexOf(cur)+1)%order.length];if(nx)d.off[pid]=nx;else delete d.off[pid];});
}

function openRequests(){
  const list=state.requests.slice().sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.t-a.t);
  const name=pid=>{const p=state.people.find(x=>x.id===pid);return p?esc(p.name):'?';};
  openSheet(`<h2>휴무 변경 요청</h2><div class="sub">승인하면 달력에 바로 반영됩니다. 직원 화면에도 결과가 표시됩니다.</div>

    <div class="actions"><button class="btn primary" id="rqlClose">닫기</button></div>`);
  $('#rqlClose').onclick=closeSheet;
  const move=(st,pid,from,to)=>{let type='off';if(from&&st.days[from]&&st.days[from].off[pid]){type=st.days[from].off[pid];delete st.days[from].off[pid];if(!Object.keys(st.days[from].off).length&&!st.days[from].memo)delete st.days[from];}
    if(to){st.days[to]=st.days[to]||{off:{},tags:[],memo:''};st.days[to].off[pid]=type;}};
  $('#sheet').querySelectorAll('.req button[data-a]').forEach(b=>b.onclick=async()=>{
    const id=b.closest('.req').dataset.q,act=b.dataset.a;const q0=state.requests.find(x=>x.id===id);if(!q0)return;
    if(act==='approved'&&!b.dataset.arm){b.dataset.arm='1';b.textContent=`${fmtK(q0.from)}→${fmtK(q0.to)} 승인?`;return;}
    if(act==='reverted'&&!b.dataset.arm){b.dataset.arm='1';b.textContent='정말 취소? 한 번 더';return;}
    await remoteMutate(st=>{const q=st.requests.find(x=>x.id===id);if(!q)return;

    renderReqBtn();openRequests();
  });
}

    const n=autoAssign(view.y,view.m,opts);closeSheet();toast(n?`휴무 ${n}일을 배정했습니다`:'더 배정할 휴무가 없습니다');
  };

function autoAssign(y,m,o){
  const n=dim(y,m);let placed=0;
  if(!o.keep){monthKeys(y,m).forEach(k=>{const d=getDay(k);if(!Object.keys(d.off).length)return;const nd=JSON.parse(JSON.stringify(d));Object.keys(nd.off).forEach(pid=>{if(nd.off[pid]==='off')delete nd.off[pid];});setDay(k,nd);});}
  state.people.forEach(p=>{
    const mine=()=>monthKeys(y,m).filter(k=>getDay(k).off[p.id]).map(k=>parseInt(k.slice(8),10));
    let have=monthKeys(y,m).filter(k=>getDay(k).off[p.id]==='off').length;
    const need=p.baseOff-have;if(need<=0)return;
    for(let i=0;i<need;i++){
      const cur=mine();const target=Math.round(((i+0.5)*n)/need);
      let best=null,bs=-1e9;
      for(let d=1;d<=n;d++){
        if(cur.includes(d))continue;
        const k=key(y,m,d),day=getDay(k),wd=dow(y,m,d);
        let s=-Math.abs(d-target)*3;
        cur.forEach(c=>{const g=Math.abs(c-d);if(g<3)s-=(3-g)*12;});
        const others=Object.keys(day.off).filter(pid=>pid!==p.id).length;
        if(o.avoidOverlap)s-=others*14;
        if(others>=o.maxPerDay)s-=400;
        if(o.avoidWeekend&&(wd===5||wd===6))s-=18;
        const ls=state.rooms.map(r=>laneState(r.id,k));
        if(o.preferWork&&ls.some(x=>x.cover&&x.cover.kind==='work'))s+=25;
        if(ls.every(x=>!x.cover))s+=6;
        s+=Math.random();
        if(s>bs){bs=s;best=d;}
      }
      if(best==null)break;
      const k=key(y,m,best);const d=JSON.parse(JSON.stringify(getDay(k)));d.off[p.id]='off';setDay(k,d);placed++;
    }
  });
  scheduleSave();render();return placed;
}

function monthText(){
  const st=monthStats(view.y,view.m);const L=[`${view.y}년 ${view.m+1}월 휴무표`];
  const f=arr=>arr.map(d=>`${d}(${DOW[dow(view.y,view.m,d)]})`).join(' ');
  st.forEach(r=>{L.push('',`■ ${r.p.name}(${WORK[r.p.work].label})  휴무 ${r.off.length}/${r.p.baseOff} · 연차 ${r.annual.length}/${r.p.annual}${r.extra.length?` · 추가 ${r.extra.length}`:''}`);
    if(r.off.length)L.push(`  휴무: ${f(r.off)}`);if(r.annual.length)L.push(`  연차: ${f(r.annual)}`);if(r.extra.length)L.push(`  추가: ${f(r.extra)}`);});
  const rl=state.rooms.map(r=>{const ins=monthKeys(view.y,view.m).map(k=>{const {cover}=laneState(r.id,k);return cover&&cover.start===k?`${parseInt(k.slice(8),10)}일 ${cover.kind==='work'?'공사':cover.nights>=2?'연박':'입실'} ${cover.nights}박`:null;}).filter(Boolean);return ins.length?`${r.name}: ${ins.join(', ')}`:null;}).filter(Boolean);
  if(rl.length)L.push('',...rl);
  const memos=monthKeys(view.y,view.m).filter(k=>getDay(k).memo).map(k=>`${parseInt(k.slice(8),10)}일 ${getDay(k).memo}`);
  if(memos.length)L.push('',...memos);
  return L.join('\n');
}

  const gridH=rowsInfo.reduce((a,r)=>a+r.h,0);
  const st=monthStats(y,m);const sumRows=Math.ceil(st.length/2);
  const H=110+36+gridH+30+sumRows*30+70;
  const cv=document.createElement('canvas');cv.width=W*scale;cv.height=H*scale;const ctx=cv.getContext('2d');ctx.scale(scale,scale);
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=INK;ctx.font='bold 34px "Gowun Batang",'+font;ctx.textBaseline='alphabetic';ctx.fillText(`${y}년 ${m+1}월 휴무표`,M,62);
  ctx.font='15px '+font;ctx.fillStyle=MUTED;const tot=st.reduce((a,r)=>a+r.total,0);ctx.fillText(`직원 ${state.people.length}명 · 휴무 ${tot}일 · 만든 날 ${now.getMonth()+1}/${now.getDate()}`,M,88);
  let top=110;ctx.font='bold 15px '+font;ctx.textAlign='center';
  DOW.forEach((d,i)=>{ctx.fillStyle=i===0?SUN:i===6?SAT:MUTED;ctx.fillText(d,M+LW+cw*i+cw/2,top+22);});
  top+=36;ctx.textAlign='left';
  ctx.strokeStyle=LINE;ctx.lineWidth=1;
  let yy=top;
  for(let w=0;w<weeks;w++){const rh=rowsInfo[w].h;
    ctx.fillStyle='#f4f6f9';ctx.fillRect(M,yy,LW,rh);ctx.strokeRect(M+.5,yy+.5,LW,rh);
    state.rooms.forEach((r,ri)=>{ctx.fillStyle=r.color;ctx.fillRect(M+2,yy+36+ri*(LH+3),3,LH);ctx.fillStyle=MUTED;ctx.font='bold 11px '+font;let nm=r.name;while(ctx.measureText(nm).width>LW-10&&nm.length>1)nm=nm.slice(0,-1);ctx.fillText(nm,M+8,yy+36+ri*(LH+3)+13);});
    for(let c=0;c<7;c++){const x=M+LW+cw*c;const d=w*7+c-first+1;
      ctx.fillStyle=(d<1||d>n)?'#f4f6f9':'#ffffff';ctx.fillRect(x,yy,cw,rh);ctx.strokeRect(x+.5,yy+.5,cw,rh);
      if(d<1||d>n)continue;
      const k=key(y,m,d),day=getDay(k);let cy=yy+8;
      if(k===todayKey){ctx.fillStyle='#fff4d6';ctx.fillRect(x+1,yy+1,cw-1,rh-1);}
      ctx.fillStyle=c===0?SUN:c===6?SAT:INK;ctx.font='bold 17px '+font;ctx.fillText(String(d),x+8,cy+17);cy+=28;
      state.rooms.forEach(r=>{const {cover,out}=laneState(r.id,k);const lx=x+1,lw=cw-2;
        const hatch=(bx,bw,col)=>{ctx.save();rr(ctx,bx,cy,bw,LH,4);ctx.clip();ctx.strokeStyle=col;ctx.lineWidth=2;for(let i=-LH;i<bw+LH;i+=7){ctx.beginPath();ctx.moveTo(bx+i,cy+LH);ctx.lineTo(bx+i+LH,cy);ctx.stroke();}ctx.restore();};
        const fillB=(b,bx,bw,rl,re)=>{const multi=b.nights>=2;ctx.save();ctx.beginPath();ctx.rect(bx,cy,bw,LH);ctx.clip();ctx.fillStyle=multi?'#f9c3c3':'#ffffff';const x0=rl?bx:bx-10,x1=re?bx+bw:bx+bw+10;rr(ctx,x0,cy,x1-x0,LH,7);ctx.fill();if(!multi){ctx.strokeStyle='#c9d1dc';ctx.lineWidth=1.5;ctx.stroke();}ctx.restore();};
        if(cover){const isIn=cover.start===k;const isEnd=bookingEnd(cover)===addDays(k,1);const bx=isIn?lx+3:lx;const bw=(isEnd?lx+lw-3:lx+lw)-bx;
          if(cover.kind==='work'){hatch(bx,bw,TAGC.work);}else fillB(cover,bx,bw,isIn,isEnd);
          if(isIn){ctx.fillStyle=INK;ctx.font='bold 11px '+font;let t=cover.kind==='work'?`공사 ${cover.nights}일`:cover.nights>=2?`연박 ${cover.nights}박`:'입실';while(ctx.measureText(t).width>bw-10&&t.length>1)t=t.slice(0,-1);ctx.fillText(t,bx+6,cy+13);}}
        else {ctx.save();ctx.strokeStyle='#eef1f5';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lx+2,cy+LH);ctx.lineTo(lx+lw-2,cy+LH);ctx.stroke();ctx.fillStyle='#aab3c2';ctx.font='11px '+font;ctx.fillText('공실',lx+8,cy+13);ctx.restore();}
        cy+=LH+3;});
      cy+=6;
      if(day.memo){ctx.fillStyle=MUTED;ctx.font='12px '+font;let memo=day.memo;while(ctx.measureText(memo).width>cw-12&&memo.length>1)memo=memo.slice(0,-1);ctx.fillText(memo,x+6,cy+13);cy+=20;}
      let ci=0;state.people.forEach(p=>{const t=day.off[p.id];if(!t)return;
        const col=ci%2,bw=(cw-16)/2,bx=x+6+col*(bw+4),bh=26;ci++;
        if(t==='off'){ctx.fillStyle=p.color;rr(ctx,bx,cy,bw,bh,6);ctx.fill();}
        else{ctx.fillStyle='#fff';rr(ctx,bx,cy,bw,bh,6);ctx.fill();ctx.save();ctx.strokeStyle=p.color;ctx.lineWidth=2.5;if(t==='extra')ctx.setLineDash([5,3]);rr(ctx,bx+1,cy+1,bw-2,bh-2,5);ctx.stroke();ctx.restore();}
        ctx.fillStyle=INK;ctx.font='bold 13px '+font;ctx.fillText(p.name,bx+6,cy+18);
        if(col===1)cy+=30;});
      if(ci%2===1)cy+=30;
    }
    yy+=rh;}
  yy+=30;ctx.font='bold 15px '+font;ctx.fillStyle=INK;ctx.fillText('직원별 집계',M,yy);yy+=12;
  st.forEach((r,i)=>{const col=i%2,row=Math.floor(i/2);const x=M+col*(W-M*2)/2,ty=yy+row*30+20;
    ctx.fillStyle=r.p.color;rr(ctx,x,ty-13,16,16,8);ctx.fill();
    ctx.fillStyle=INK;ctx.font='bold 14px '+font;ctx.fillText(r.p.name,x+24,ty);
    ctx.fillStyle=MUTED;ctx.font='13px '+font;ctx.fillText(`${WORK[r.p.work].label} · 휴무 ${r.off.length}/${r.p.baseOff} · 연차 ${r.annual.length}/${r.p.annual}${r.extra.length?` · 추가 ${r.extra.length}`:''}${r.offLeft>0?` · ${r.offLeft}일 남음`:''}`,x+24+ctx.measureText(r.p.name).width+28,ty);});
  yy+=sumRows*30+28;ctx.fillStyle=MUTED;ctx.font='12px '+font;ctx.fillText('객실 띠: 빨강 = 연박 · 흰색 = 입실(단박) · 빈칸 = 공실 · 주황 빗금 = 공사   |   직원: 색 채움 = 휴무 · 테두리 = 연차 · 점선 = 추가휴무',M,yy);
  return new Promise(res=>cv.toBlob(b=>res(b),'image/png'));
}
async function openImage(){
  openSheet(`<h2>이미지 만드는 중…</h2>`);
  const blob=await renderCalendarImage();if(!blob){toast('이미지를 만들지 못했습니다');closeSheet();return;}
  const url=URL.createObjectURL(blob);const file=new File([blob],`${view.y}년_${view.m+1}월_휴무표.png`,{type:'image/png'});
  const canShare=!window.claude&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]});
  openSheet(`<h2>${view.m+1}월 휴무표 이미지</h2><div class="sub">${window.claude?'이미지를 길게 눌러(또는 오른쪽 클릭) 저장하세요.':'공유를 누르면 카톡 등으로 바로 보낼 수 있습니다.'}</div>
    <img id="calImg" src="${url}" alt="${view.y}년 ${view.m+1}월 휴무표" style="width:100%;border:1px solid var(--line);border-radius:8px">
    <div class="actions">${canShare?'<button class="btn primary" id="imgShare">📤 카톡 등으로 공유</button>':''}${window.claude?'':'<button class="btn" id="imgSave">📥 이미지 저장</button>'}<button class="btn" id="imgClose">닫기</button></div>`);
  $('#imgClose').onclick=closeSheet;
  const sh=$('#imgShare');if(sh)sh.onclick=async()=>{try{await navigator.share({files:[file],title:`${view.y}년 ${view.m+1}월 휴무표`});}catch(e){if(!(e&&e.name==='AbortError'))toast('공유가 되지 않아 저장 버튼을 쓰세요');}};
  const sv=$('#imgSave');if(sv)sv.onclick=()=>{const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);toast('이미지를 저장했습니다');};
}
$('#backupBtn').onclick=openBackup;
$('#shareSetBtn').onclick=openShareSettings;
$('#reqBtn').onclick=()=>{if(!viewOnly)openRequests();};
window.addEventListener('hashchange',()=>{if(/[#&](db=|ro=)/.test(location.hash)||fbUrl)location.reload();});

applySeed();pickStartMonth();
initCloud();
render();
if(viewOnly)applyViewMode();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.claude){
  try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
}
})();
